name: Repository hygiene\non:\n  push:\n  pull_request:\npermissions:\n  contents: read\njobs:\n  hygiene:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Check out repository\n        uses: actions/checkout@v4\n      - name: Require a README\n        run: test -s README.md\n      - name: Reject tracked OS metadata\n        run: '! git ls-files | grep -E "(^|/)(\\.DS_Store|Thumbs\\.db)$"'\n